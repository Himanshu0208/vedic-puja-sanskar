name: Build and deploy backend

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag "vedic-puja-backend:${GITHUB_SHA}" ./backend

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/vedic-puja-sanskar-backend
        run: |
          docker tag "vedic-puja-backend:${GITHUB_SHA}" "$IMAGE_NAME:${GITHUB_SHA}"
          docker tag "vedic-puja-backend:${GITHUB_SHA}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    needs: build
    runs-on: self-hosted
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull and run backend
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/vedic-puja-sanskar-backend
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -eu
          test -n "$POSTGRES_DB"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          test -n "$POSTGRES_DATABASE_URL"
          test -n "$JWT_SECRET"
          test -n "$SMTP_HOST"
          test -n "$SMTP_PORT"
          test -n "$SMTP_USERNAME"
          test -n "$SMTP_PASSWORD"
          test -n "$EMAIL_FROM"

          NETWORK_NAME=vedic-puja-network
          docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || docker network create "$NETWORK_NAME"
          docker volume create vedic-puja-db-data >/dev/null
          docker volume create vedic-puja-uploads >/dev/null

          if docker container inspect vedic-puja-db >/dev/null 2>&1; then
            docker start vedic-puja-db >/dev/null 2>&1 || true
            if ! docker inspect vedic-puja-db --format '{{json .NetworkSettings.Networks}}' | grep -q '"vedic-puja-network"'; then
              docker network connect "$NETWORK_NAME" vedic-puja-db
            fi
          else
            docker run --detach \
              --name vedic-puja-db \
              --restart unless-stopped \
              --network "$NETWORK_NAME" \
              --volume vedic-puja-db-data:/var/lib/postgresql/data \
              --env POSTGRES_DB \
              --env POSTGRES_USER \
              --env POSTGRES_PASSWORD \
              postgres:15-alpine
          fi

          db_ready=false
          for attempt in $(seq 1 30); do
            if docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" vedic-puja-db \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT 1' >/dev/null 2>&1; then
              db_ready=true
              break
            fi
            sleep 2
          done
          if [ "$db_ready" != true ]; then
            docker logs --tail 100 vedic-puja-db
            exit 1
          fi

          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker stop vedic-puja-backend || true
          docker rm vedic-puja-backend || true
          docker volume create vedic-puja-uploads
          docker run --detach \
            --name vedic-puja-backend \
            --restart unless-stopped \
            --network "$NETWORK_NAME" \
            --publish 8080:8080 \
            --volume vedic-puja-uploads:/root/uploads \
            --env HOST=0.0.0.0 \
            --env PORT=8080 \
            --env MIGRATIONS_PATH=file:///app/db/migrations \
            --env IMAGE_STORAGE_PATH=/root/uploads \
            --env POSTGRES_DATABASE_URL \
            --env JWT_SECRET \
            --env ACCESS_TOKEN_EXPIRY \
            --env REFRESH_TOKEN_EXPIRY \
            --env RAZORPAY_KEY_ID \
            --env RAZORPAY_KEY_SECRET \
            --env SMTP_HOST \
            --env SMTP_PORT \
            --env SMTP_USERNAME \
            --env SMTP_PASSWORD \
            --env EMAIL_FROM \
            "$IMAGE_NAME:$IMAGE_TAG"

          backend_healthy=false
          for attempt in $(seq 1 45); do
            health_status=$(docker inspect vedic-puja-backend --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' 2>/dev/null || true)
            if [ "$health_status" = healthy ]; then
              backend_healthy=true
              break
            fi
            if [ "$health_status" = unhealthy ] || [ "$health_status" = missing ]; then
              break
            fi
            sleep 2
          done
          if [ "$backend_healthy" != true ]; then
            docker logs --tail 100 vedic-puja-backend
            exit 1
          fi
