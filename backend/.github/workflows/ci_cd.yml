name: Deployment Workflow

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create .env file
        run: |
          echo "Creating .env file..."
          # Add commands to create your .env file here
          echo """
          POSTGRES_DATABASE_URL=${{ secrets.POSTGRES_DATABASE_URL }}
          MIGRATIONS_PATH=${{ secrets.MIGRATIONS_PATH }}
          HOST=${{ secrets.HOST }}  
          PORT=${{ secrets.PORT }}
          IMAGE_STORAGE_PATH=${{ secrets.IMAGE_STORAGE_PATH }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRY=${{secrets.ACCESS_TOKEN_EXPIRY}}
          REFRESH_TOKEN_EXPIRY=${{secrets.REFRESH_TOKEN_EXPIRY}}
          RAZORPAY_KEY_ID=${{secrets.RAZORPAY_KEY_ID}}
          RAZORPAY_KEY_SECRET=${{secrets.RAZORPAY_KEY_SECRET}}
          POSTGRES_DB=${{secrets.POSTGRES_DB}}
          POSTGRES_USER=${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD=${{secrets.POSTGRES_PASSWORD}}
          """ > .env

      -name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t myapp:latest .

      - name: Push Docker image to Docker Hub
        run: |
          echo "Pushing Docker image to Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull Docker Image
        uses: docker pull myapp:latest
      
      - name: Stop Existing Container
        run: |
          echo "Stopping existing container..."
          docker stop myapp-container || true
          docker rm myapp-container || true

      - name: Run Docker Container
        run: |
          echo "Running Docker container..."
          docker run -d -p 4040:4040 --name myapp-container myapp